name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run tests and checks
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
      GITHUB_TOKEN: ""
      KIMI_API_KEY: ""
      OPENAI_API_KEY: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio pytest-xdist

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Validate Chrome extension files
        run: |
          node --check extension/content.js
          node --check extension/popup.js
          node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json', 'utf8')); console.log('manifest.json is valid JSON')"

      - name: Check Python syntax
        run: |
          python -m compileall backend tests

      - name: Run Python tests
        run: |
          python -m pytest tests/ -v -ra --tb=short
